<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>{{{ PRODUCT_NAME }}} (Unity)</title>
<style>
  html, body { margin: 0; height: 100%; background: #16171c; overflow: hidden; touch-action: none; }
  #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #16171c; outline: none; }
  #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; color: #e9e9ee; font: 600 15px/1.3 system-ui, sans-serif; text-align: center; }
  #bar { width: min(320px, 70vw); height: 8px; border-radius: 4px; background: #2b2d33; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #f4c22b; transition: width .15s; }
  #err { color: #ff8f8f; max-width: 80vw; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><div>Street Life, Unity build</div><div id="bar"><i></i></div><div id="pct">Downloading…</div><div id="err"></div></div>
<script>
  // Timings the comparison page reads (same origin): slStart, slLoadedAt (engine up), slReadyAt (first match frame, from the game)
  window.slStart = performance.now();
  var canvas = document.querySelector("#unity-canvas");
  var config = {
    arguments: [],
    dataUrl: "Build/{{{ DATA_FILENAME }}}",
    frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
    codeUrl: "Build/{{{ CODE_FILENAME }}}",
    streamingAssetsUrl: "StreamingAssets",
    companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
    productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
    productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
  };
  // phones: render at up to 2x (like the web game's pixel-ratio cap) so the S24 isn't drawing 3x the pixels
  if (/Android|iPhone|iPad/i.test(navigator.userAgent)) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  var bar = document.querySelector("#bar i"), pct = document.querySelector("#pct");
  var s = document.createElement("script");
  s.src = "Build/{{{ LOADER_FILENAME }}}";
  s.onload = function () {
    createUnityInstance(canvas, config, function (p) { bar.style.width = (100 * p) + "%"; pct.textContent = p < .9 ? "Downloading… " + Math.round(100 * p) + "%" : "Starting…"; })
      .then(function (inst) {
        window.slInstance = inst; window.slLoadedAt = performance.now();
        document.querySelector("#loading").remove(); canvas.focus();
      })
      .catch(function (e) { document.querySelector("#err").textContent = String(e); });
  };
  document.body.appendChild(s);
  canvas.addEventListener("pointerdown", function () { canvas.focus(); });
</script>
</body>
</html>
